name: iOS tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode and simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [d for runtime, rows in devices.items() if "iOS-26-5" in runtime for d in rows if d["name"].startswith("iPhone")]
          if not candidates:
              sys.exit("No iOS 26.5 iPhone simulator installed")
          print(candidates[0]["udid"])
          ')
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild -project infinite-gallery.xcodeproj -scheme infinite-gallery \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
